services:
  - type: web
    name: alternance-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m playwright install chromium --with-deps
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: DATABASE_URL
        fromDatabase:
          name: alternance-db
          property: connectionString
      - key: UPLOAD_DIR
        value: ./uploads
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_USER
        value: alte.smart@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: FT_CLIENT_ID
        sync: false
      - key: FT_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false

databases:
  - name: alternance-db
    databaseName: alternance
    plan: free
